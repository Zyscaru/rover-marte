<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo para aprender Java programando um rover em Marte: rochas, cristais e missões em fases.">
<meta name="theme-color" content="#24151c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rover Marte">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Rover em Marte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: painel de controle da missão — briefing + editor à esquerda, terreno marciano fixo à direita; no celular: briefing, terreno, editor.
   Visual único e escuro (crepúsculo em Marte), escolhido de propósito. */
:root{
  color-scheme: dark;
  --bg:#24151c; --panel:#321e27; --panel-2:#3d2531; --ink:#f7e9df; --ink-soft:#caa99d; --line:#523644;
  --sand:#c9703f; --sand-2:#bd6638; --sand-dot:#d98a58; --rock:#5c2c28; --rock-hi:#7d3f35; --rock-lo:#3e1c1b;
  --crystal:#5fe3f0; --crystal-dk:#169cad; --pad:#ece7e1; --pad-stripe:#ff8a3d;
  --accent:#5fe3f0; --accent-ink:#10242a; --hot:#ff8a3d;
  --code-bg:#170d12; --code-fg:#f2e6de; --code-dim:#9a7f86; --key:#2e1b24;
  --ok:#74e3a8; --ok-bg:#183b2b; --err:#ff9585; --err-bg:#4b2229; --star:#ffd166; --star-off:#5c4452;
  --f-display:"Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 380px at 72% -120px, #55293a 0%, transparent 70%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1320px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.14em;color:var(--ink-soft)}
.logo svg{width:40px;height:40px;flex:none}
.logo div{white-space:nowrap}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1320px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;min-width:0}
.mission{grid-area:mission;padding:20px 22px}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hot)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,3.2vw,2.5rem);line-height:1;margin:6px 0 12px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:62ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.85em;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.mission pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.85rem;border-radius:10px;padding:10px 14px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--line)}
.ref{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.ref h2{font-family:var(--f-display);font-size:1rem;margin:0;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:5px 9px;font-family:var(--f-code);font-size:.8rem;text-align:left;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--ink-soft)}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:16px;overflow:hidden;border:1.5px solid var(--line)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:40px 1fr;min-height:220px;max-height:52vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.9rem;line-height:1.6;color:#6b5560;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.9rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--accent);min-height:220px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.9rem}
.keys button:active{background:var(--crystal-dk)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.85rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:.86rem;white-space:pre-wrap;font-family:var(--f-code)}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.82rem;white-space:pre;overflow-x:auto;margin:0;border:1px solid var(--line)}

/* terreno */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.bhead b{color:var(--ink)}
.maps{display:flex;gap:6px}
.maps button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 9px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:linear-gradient(180deg,#3a1f24,#2b171c);border-radius:12px;padding:10px;overflow:hidden;min-height:180px;border:1px solid var(--line)}
.board{position:relative;display:grid;gap:0;border-radius:6px;overflow:hidden}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.f{background:var(--sand);background-image:radial-gradient(circle at 30% 35%,var(--sand-dot) 0 6%,transparent 7%),radial-gradient(circle at 72% 70%,var(--sand-2) 0 9%,transparent 10%)}
.cell.f.alt{background-color:var(--sand-2)}
.cell.w{background:var(--sand-2)}
.cell.w::after{content:"";position:absolute;inset:7%;background:radial-gradient(circle at 35% 30%,var(--rock-hi),var(--rock) 55%,var(--rock-lo));border-radius:46% 54% 42% 58% / 55% 45% 55% 45%;box-shadow:0 calc(var(--c)*.06) 0 rgba(0,0,0,.25)}
.cell.w.v2::after{border-radius:58% 42% 55% 45% / 45% 58% 42% 55%;inset:10% 6% 6% 10%}
.cell.w.v3::after{border-radius:50% 50% 40% 60% / 60% 40% 60% 40%;inset:6% 10% 10% 6%}
.coin{position:absolute;left:50%;top:50%;width:40%;height:40%;transform:translate(-50%,-50%) rotate(45deg);border-radius:12%;background:linear-gradient(135deg,#d9fbff 0%,var(--crystal) 40%,var(--crystal-dk) 100%);box-shadow:0 0 calc(var(--c)*.22) rgba(95,227,240,.65);transition:transform .3s, opacity .3s;z-index:2}
.coin.got{transform:translate(-50%,-160%) rotate(225deg) scale(.3);opacity:0}
.flag{position:absolute;inset:8%;z-index:1}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:3;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;transition:transform var(--spd,180ms) ease-in-out;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.robot.crash svg{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:50%;background:radial-gradient(circle,var(--hot),transparent 70%);opacity:.8;z-index:4;animation:fade 1s forwards}
@keyframes fade{to{opacity:0}}
.bubble{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--code-bg);color:var(--accent);border:2px solid var(--accent);border-radius:10px;padding:2px 10px;font-weight:700;font-family:var(--f-code);font-size:.95rem;white-space:nowrap}
.bubble::before{content:"📡 ";}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(36,21,28,.78);z-index:10;padding:16px}
.win{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:18px 20px;text-align:center;max-width:330px;display:flex;flex-direction:column;gap:8px;align-items:center}
.win b{font-family:var(--f-display);font-size:1.6rem;text-transform:uppercase;letter-spacing:.03em}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.out{font-family:var(--f-code);font-size:.8rem;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:auto}
.out:empty{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* mapa de missões */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px}
.world h2{font-family:var(--f-display);margin:0;font-size:1.4rem;text-transform:uppercase;letter-spacing:.03em}
.world h2 span{color:var(--hot)}
.world p{margin:2px 0 12px;color:var(--ink-soft);font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--ink-soft)}
.tile .n{font-family:var(--f-display);font-size:.8rem;color:var(--ink-soft);letter-spacing:.1em}
.tile b{font-size:.98rem;line-height:1.2}
.tile .s{font-size:1rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.intro-card p{margin:0;max-width:62ch}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:980px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .logo{font-size:1.25rem;gap:8px}
  .logo svg{width:32px;height:32px}
  .logo small{display:none}
  .top .btn{padding:8px 12px}
  #code,.gutter{font-size:16px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
}
@media (pointer:fine) and (min-width:981px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot svg,.coin{transition:none}.robot.crash svg{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#c9703f"/><circle cx="13" cy="15" r="4" fill="#a8552d"/><circle cx="26" cy="26" r="5" fill="#a8552d"/><circle cx="27" cy="12" r="2.2" fill="#a8552d"/><path d="M3 22 Q20 30 37 22" stroke="#5fe3f0" stroke-width="2" fill="none" opacity=".8"/></svg><div>Rover em Marte<small>Missões em Java</small></div></div>
  <div class="top-r">
    <span class="pill" title="Estrelas conquistadas"><span class="st">★</span><span id="starCount">0</span></span>
    <button class="btn" id="levelsBtn">Missões</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<template id="gameTpl">
  <div class="game">
    <section class="card mission" id="mission"></section>
    <section class="card boardcard" aria-label="Terreno">
      <div class="bhead"><span id="bstatus"></span><div class="maps" id="maps"></div></div>
      <div class="stage" id="stage"><div class="board" id="board"></div></div>
      <div class="legend"><span><i style="background:var(--pad)"></i>Rover</span><span><i style="background:var(--crystal);transform:rotate(45deg) scale(.8)"></i>Cristal</span><span><i style="background:var(--pad-stripe);border-radius:50%"></i>Base</span><span><i style="background:var(--rock)"></i>Rocha</span></div>
      <div class="out" id="out"></div>
    </section>
    <section class="edcol">
      <div class="editor">
        <div class="ed-head"><span>Missao.java</span><span id="engine" class="loading">preparando o Java…</span></div>
        <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código Java"></textarea></div>
        <div class="keys" id="keys" aria-label="Símbolos"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="run">▶ Lançar missão</button>
        <button class="btn" id="stop" hidden>■ Abortar</button>
        <button class="btn ghost" id="reset">Recomeçar código</button>
        <div class="speed" role="group" aria-label="Velocidade">
          <button data-speed="420">Lento</button><button data-speed="200">Normal</button><button data-speed="70">Rápido</button>
        </div>
      </div>
      <div id="feedback"></div>
    </section>
  </div>
</template>

<script>
/* MiniJava — interpretador de um subconjunto amplo de Java, para ensino no navegador.
   Suporta: classes, herança, interfaces, construtores, static, arrays, String, StringBuilder,
   Scanner (com entrada interativa por replay), Random, Math, ArrayList, HashMap/HashSet (ordem igual à do Java),
   exceções (try/catch/finally/throw), switch clássico e com seta, lambdas simples, printf/String.format
   e arquivos compactos do Java 25 (void main() solto). */
(function (root) {
"use strict";

/* =================================================================== erros */
class CompileError extends Error { constructor(msg, line){ super(msg); this.line = line; } }
class NeedInput extends Error { constructor(outLen){ super("need input"); this.outLen = outLen; } }
class ExitSignal extends Error {}
class TooLong extends Error { constructor(){ super("too long"); } }
class JavaThrow extends Error { constructor(obj, line){ super("java exception"); this.obj = obj; this.line = line; } }
class BreakSig { constructor(label){ this.label = label; } }
class ContinueSig { constructor(label){ this.label = label; } }
class ReturnSig { constructor(v){ this.v = v; } }
class YieldSig { constructor(v){ this.v = v; } }

/* =================================================================== valores */
let ID = 1;
class Dbl { constructor(v){ this.v = v; } }
class Chr { constructor(c){ this.c = c; } }
class JArr { constructor(t, a){ this.t = t; this.a = a; this.id = ID++; } }
class JObj { constructor(cls){ this.cls = cls; this.f = Object.create(null); this.id = ID++; } }
class JList { constructor(a, kind){ this.a = a || []; this.kind = kind || "ArrayList"; this.id = ID++; } }
class JSB { constructor(s){ this.s = s || ""; this.id = ID++; } }
class JEntry { constructor(k, v){ this.k = k; this.v = v; } }
class JLambda { constructor(params, body, ctx){ this.params = params; this.body = body; this.ctx = ctx; this.id = ID++; } }
class ClassRef { constructor(cls){ this.cls = cls; } }
class BuiltinRef { constructor(name){ this.name = name; } }
class JScanner { constructor(){ this.id = ID++; } }
class JRandom { constructor(seed){ this.rng = mulberry(seed); this.id = ID++; } }
class HostObj { constructor(name, fn){ this.name = name; this.fn = fn; this.id = ID++; } }
const OUT = { kind:"out" }, IN = { kind:"in" };

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- HashMap com a mesma ordem de iteração do Java ---------- */
class JMap {
  constructor(kind){ this.kind = kind || "HashMap"; this.id = ID++; this.clear(); }
  clear(){ this.n = 16; this.tab = Array.from({length:16}, ()=>[]); this.size = 0; this.order = []; }
  idx(h){ h = h ^ (h >>> 16); return h & (this.n - 1); }
  findIn(k){ const h = jHash(k); const b = this.tab[this.idx(h)]; for (const e of b) if (jEquals(e.k, k)) return e; return null; }
  get(k){ const e = this.findIn(k); return e ? e.v : undefined; }
  has(k){ return !!this.findIn(k); }
  put(k, v){
    const e = this.findIn(k);
    if (e){ const old = e.v; e.v = v; return old; }
    const ne = new JEntry(k, v); ne.h = jHash(k);
    this.tab[this.idx(ne.h)].push(ne); this.order.push(ne); this.size++;
    if (this.size > this.n * 0.75) this.resize();
    return undefined;
  }
  resize(){
    const old = this.tab; this.n *= 2; this.tab = Array.from({length:this.n}, ()=>[]);
    for (const b of old) for (const e of b) this.tab[this.idx(e.h)].push(e);
  }
  remove(k){
    const h = jHash(k); const b = this.tab[this.idx(h)];
    const i = b.findIndex(e => jEquals(e.k, k)); if (i < 0) return undefined;
    const e = b.splice(i, 1)[0]; this.order.splice(this.order.indexOf(e), 1); this.size--; return e.v;
  }
  entries(){

  coerce(v, t, line, ctxMsg){

    const incompatible = () => bad(`tipos incompatíveis: ${tn} não pode ser convertido para ${t}`);
    const lossy = () => bad(`possível perda de precisão ao converter ${tn} para ${t}. Use um cast, como (${t === "Integer" ? "int" : t}) valor`);
    switch (t){
      case "int": case "Integer":
        if (v === null){ if (t === "Integer") return null; return this.npe(line); }

      case "long": case "Long":

      case "char": case "Character":

  /* ---------- execução ---------- */
  tick(){ if (++this.steps > STEP_LIMIT) throw new TooLong(); }
  run(entry){

      if (!m) throw new CompileError("não encontrei o método main. Todo programa Java começa por public static void main(String[] args)", 1);

  }
  runTest(code){

    if (!cls) for (const [, c] of this.classes) if (c.user && c.methods.some(x => x.name === "main")){ cls = c; break; }
    if (!cls) for (const [, c] of this.classes) if (c.user){ cls = c; break; }

  }
  ensureStatic(cls){
    if (cls.staticReady) return; cls.staticReady = true;

    for (const f of cls.fields) if (f.isStatic) cls.statics[f.name] = { t: f.type, v: this.defaultOf(f.type), decl: f };
    for (const f of cls.fields) if (f.isStatic && f.init) cls.statics[f.name].v = this.coerce(this.evalInit(f.init, f.type, ctx), f.type, f.line);
    for (const b of cls.inits) if (b.isStatic) this.execBlock(b.body, { cls, self: null, scope: new Scope(null, true) });

  }
  evalInit(init, type, ctx){ return init.k === "arrinit" ? this.arrInit(init, ctx) : this.eval(init, ctx, type); }

  /* ---------- objetos ---------- */
  initFields(o, cls){

    for (const f of cls.fields) if (!f.isStatic) o.f[f.name] = this.defaultOf(f.type);
  }
  runFieldInits(o, cls){
    const ctx = { cls, self: o, scope: new Scope(null, true) };
    for (const f of cls.fields) if (!f.isStatic && f.init) o.f[f.name] = this.coerce(this.evalInit(f.init, f.type, ctx), f.type, f.line);
    for (const b of cls.inits) if (!b.isStatic) this.execBlock(b.body, ctx);

  instantiate(cls, args, line){
    if (cls.isInterface) this.cerr(`${cls.name} é uma interface e não pode ser instanciada com new`, line);
    if (cls.isAbstract) this.cerr(`${cls.name} é abstrata e não pode ser instanciada com new`, line);
    this.ensureStatic(cls);
    const o = new JObj(cls); this.initFields(o, cls);
    this.construct(cls, o, args, line);

  }
  pickCtor(cls, args, line){
    if (!cls.ctors.length){ if (args.length) this.cerr(`a classe ${cls.name} não tem um construtor que receba ${args.length} valor${args.length > 1 ? "es" : ""}`, line); return null; }

    if (!c) this.cerr(`a classe ${cls.name} não tem um construtor que receba ${args.length ? "(" + args.map(a => javaTypeName(a)).join(", ") + ")" : "zero valores"}`, line);

    if (first && first.k === "expr" && first.e.k === "call" && first.e.ctorCall){

      if (first.e.name === "this"){ this.construct(cls, o, a, first.line); try { this.execList(body.slice(1), ctx); } catch (e){ if (!(e instanceof ReturnSig)) throw e; } this.depth--; return; }
      if (!cls.parent) this.cerr(`${cls.name} não herda de nenhuma classe, então não pode chamar super(...)`, first.line);

    } else if (cls.parent){
      const pc = cls.parent; if (pc.ctors.length && !pc.ctors.some(k => k.params.length === 0)) this.cerr(`o construtor de ${cls.name} precisa começar com super(...) passando os valores do construtor de ${pc.name}`, ctor.line);
      this.construct(pc, o, [], line);
    }
    this.runFieldInits(o, cls);
    try { this.execList(idx ? body.slice(idx) : body, ctx); }
    catch (e){ if (!(e instanceof ReturnSig)) throw e; }
    this.depth--;
  }

  /* ---------- métodos ---------- */
  score(v, t){
    if (t === "var" || t === undefined) return 1;
    if (v === null) return ["int","long","double","char","boolean"].includes(t) ? -1 : 1;
    const tn = javaTypeName(v);
    if (tn === t) return 3;
    if (t === "Object") return 1;
    if (typeof v === "number"){ if (t === "Integer") return 2; if (t === "long" || t === "Long") return 2; if (t === "double" || t === "Double") return 1; return -1; }
    if (v instanceof Chr){ if (t === "Character") return 2; if (t === "int") return 2; if (t === "long" || t === "double") return 1; return -1; }
    if (typeof v === "bigint"){ if (t === "Long") return 2; if (t === "double") return 1; return -1; }
    if (v instanceof Dbl){ return t === "Double" ? 2 : -1; }
    if (typeof v === "boolean") return t === "Boolean" ? 2 : -1;
    if (typeof v === "string") return t === "CharSequence" || t === "Comparable" ? 2 : -1;
    if (v instanceof JObj){ if (this.isSub(v.cls, t)) return 2; return this.classes.has(t) ? -1 : 0; }
    if (v instanceof JArr) return t.endsWith("[]") ? 2 : -1;
    if (v instanceof JList) return ["List","ArrayList","Collection","Iterable","LinkedList"].includes(t) ? 2 : (this.classes.has(t) || PRIM.has(t) || t === "String") ? -1 : 0;
    if (v instanceof JMap) return ["Map","HashMap","TreeMap","LinkedHashMap"].includes(t) ? 2 : (this.classes.has(t) || PRIM.has(t) || t === "String") ? -1 : 0;
    if (v instanceof JLambda) return (PRIM.has(t) || t === "String" || (this.classes.has(t) && !this.classes.get(t).isInterface)) ? -1 : 1;

  }
  bestOverload(cands, args){
    let best = null, bs = -1;
    for (const m of cands){
      if (m.params.length !== args.length) continue;
      let s = 0, ok = true;
      for (let i = 0; i < args.length; i++){ const k = this.score(args[i], m.params[i].type); if (k < 0){ ok = false; break; } s += k; }

  findMethod(cls, name, nargs, instanceOnly){

  findIfaceDefault(iname, name, nargs){ const ic = this.classes.get(iname); if (!ic) return null; const m = ic.methods.find(x => x.name === name && x.params.length === nargs && x.body); if (m) return m; for (const j of ic.ifaces){ const r = this.findIfaceDefault(j, name, nargs); if (r) return r; } return null; }

  invokeVirtual(obj, m, args, line){

  noMethod(cname, name, args, cands, line){

  invoke(m, self, args, line){

  /* ---------- instruções ---------- */
  execBlock(b, ctx){ const inner = { ...ctx, scope: new Scope(ctx.scope, false) }; this.execList(b.body, inner); }

  cond(e, ctx, where){

/* ---------- simulação ---------- */
class RoverErro extends Error {}
class Sim {
  constructor(map){
    this.grid = map.grid.map(r => r.split(""));
    this.h = this.grid.length; this.w = this.grid[0].length;
    [this.x, this.y] = map.start; this.dir = DIRS[map.start[2]];
    this.coins = new Set(); this.totalCoins = 0;
    this.grid.forEach((row, y) => row.forEach((c, x) => {
      if (c === "o" || c === "G"){ this.coins.add(x + "," + y); this.totalCoins++; }
      if (c === "F" || c === "G") this.flag = [x, y];
    }));
    this.trace = []; this.steps = 0; this.said = [];
  }
  wall(x, y){ return x < 0 || y < 0 || x >= this.w || y >= this.h || this.grid[y][x] === "#"; }
  tick(){ if (++this.steps > 1500) throw new RoverErro("O rover gastou energia demais: mais de 1500 movimentos. Talvez o laço nunca termine; confira a condição do while."); }
  andar(){
    this.tick();
    const nx = this.x + DX[this.dir], ny = this.y + DY[this.dir];
    if (this.wall(nx, ny)){ this.trace.push({t:"crash", x:nx, y:ny}); throw new RoverErro("O rover bateu numa rocha!"); }
    this.x = nx; this.y = ny; this.trace.push({t:"move", x:nx, y:ny});
  }
  virar(lado){ this.tick(); this.dir = (this.dir + (lado > 0 ? 1 : 3)) % 4; this.trace.push({t:"turn", d:lado}); }
  pegar(){
    this.tick();
    const k = this.x + "," + this.y;
    if (!this.coins.has(k)){ this.trace.push({t:"miss"}); throw new RoverErro("Não há cristal aqui para coletar."); }
    this.coins.delete(k); this.trace.push({t:"pick", x:this.x, y:this.y});
  }
  livre(rel){ const d = (this.dir + rel + 4) % 4; return !this.wall(this.x + DX[d], this.y + DY[d]); }
  temMoeda(){ return this.coins.has(this.x + "," + this.y); }
  chegou(){ return this.x === this.flag[0] && this.y === this.flag[1]; }
  dizer(v){ this.tick(); this.said.push(v); this.trace.push({t:"say", v}); }
  result(level){
    if (!this.chegou()) return { ok:false, msg:"O programa terminou, mas o rover não chegou à base." };
    if (this.coins.size) return { ok:false, msg:`O rover chegou à base, mas ficaram ${this.coins.size} crista${this.coins.size>1?"is":"l"} para trás.` };
    if (level.say){
      const esperado = String(level.say(this));
      const ultimo = this.said.length ? this.said[this.said.length-1] : null;
      if (ultimo === null) return { ok:false, msg:"O rover chegou, mas não transmitiu nada. Use rover.transmitir(...) para enviar a resposta." };
      if (ultimo !== esperado) return { ok:false, msg:`O rover transmitiu ${ultimo}, mas a resposta certa neste mapa era ${esperado}.` };
    }
    return { ok:true };
  }
}

/* ---------- o objeto rover, visto pelo código Java ---------- */
const COMANDOS = {
  andar: ["rover.andar();", "anda uma casa para a frente"],
  virarEsquerda: ["rover.virarEsquerda();", "gira 90° para a esquerda, sem sair do lugar"],
  virarDireita: ["rover.virarDireita();", "gira 90° para a direita, sem sair do lugar"],
  coletar: ["rover.coletar();", "coleta o cristal da casa onde o rover está"],
  frenteLivre: ["rover.frenteLivre()", "true se não houver rocha à frente"],
  esquerdaLivre: ["rover.esquerdaLivre()", "true se não houver rocha à esquerda"],
  direitaLivre: ["rover.direitaLivre()", "true se não houver rocha à direita"],
  temCristal: ["rover.temCristal()", "true se houver cristal na casa atual"],
  naBase: ["rover.naBase()", "true se o rover estiver na base"],
  transmitir: ["rover.transmitir(valor);", "envia um valor para a Terra"],
};
function criarRover(sim){
  return new MiniJava.HostObj("rover", (name, args, line, it) => {
    const semValores = () => { if (args.length) it.cerr(`rover.${name}() não recebe valores entre os parênteses. Para repetir, use um laço`, line); };
    try {
      switch (name){
        case "andar": semValores(); sim.andar(); return;
        case "virarEsquerda": semValores(); sim.virar(-1); return;
        case "virarDireita": semValores(); sim.virar(1); return;
        case "coletar": semValores(); sim.pegar(); return;
        case "frenteLivre": semValores(); return sim.livre(0);
        case "esquerdaLivre": semValores(); return sim.livre(-1);
        case "direitaLivre": semValores(); return sim.livre(1);
        case "temCristal": semValores(); return sim.temMoeda();
        case "naBase": semValores(); return sim.chegou();
        case "transmitir": if (args.length !== 1) it.cerr("rover.transmitir() recebe exatamente um valor, como rover.transmitir(total)", line); sim.dizer(it.str(args[0])); return;
      }
    } catch (e){
      if (e instanceof RoverErro){ const err = new Error(e.message); err.isHost = true; err.line = line; throw err; }
      throw e;
    }
    const parecido = Object.keys(COMANDOS).find(k => k.toLowerCase() === name.toLowerCase());
    it.cerr(parecido ? `o comando é rover.${parecido}() (o Java diferencia maiúsculas de minúsculas)` : `o rover não tem o comando ${name}(). Os comandos estão na lista da missão`, line);
  });
}

// conta linhas de código "de verdade": ignora linhas vazias, comentários, chaves soltas e a linha do main
function linhasDeCodigo(code){
  return code.split("\n").map(l => l.trim()).filter(t => t && !t.startsWith("//") && t !== "}" && t !== "{" && !/^(public\s+)?(static\s+)?void\s+main\s*\(.*\)\s*\{?$/.test(t)).length;
}
FASES.forEach(f => { f.maps = MAPAS[f.map]; f.par = linhasDeCodigo(f.solution); });

if (typeof module !== "undefined") module.exports = { FASES, MUNDOS, COMANDOS, Sim, criarRover, linhasDeCodigo, setMapas: m => { FASES.forEach(f => { f.maps = m[f.map]; }); } };

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {

};
let stars = store.get("stars", {});
let speed = store.get("speed", 200);
let runId = 0;
let cur = null, ready = false, running = false, abort = false, attempts = 0, shownMap = 0, mapStatus = [];

const unlocked = i => i===0 || (stars[FASES[i-1].id]||0) > 0;
const totalStars = () => Object.values(stars).reduce((a,b)=>a+b,0);
const starsHtml = n => [1,2,3].map(i=>`<span class="${i<=n?"on":""}">★</span>`).join("");
function updateStarCount(){ $("#starCount").textContent = `${totalStars()} / ${FASES.length*3}`; }

/* ---------------- mapa de missões ---------------- */

    ${nextI>=0?`<button class="btn primary" id="playNext">${totalStars()?"Continuar":"Começar"}: missão ${nextI+1} →</button>`:`<b>Você completou todas as missões!</b>`}</div>
    ${MUNDOS.map((m,mi)=>`<section class="card world"><h2><span>Setor ${mi+1}</span> · ${esc(m.titulo)}</h2><p>${esc(m.ideia)}</p><div class="tiles">
      ${FASES.map((f,i)=>({f,i})).filter(o=>o.f.mundo===mi).map(({f,i})=>`<button class="tile ${i===nextI?"next":""}" data-i="${i}" ${unlocked(i)?"":"disabled"}><span class="n">MISSÃO ${i+1}${unlocked(i)?"":" · 🔒"}</span><b>${esc(f.titulo)}</b><span class="s">${starsHtml(stars[f.id]||0)}</span></button>`).join("")}
    </div></section>`).join("")}

    <div class="ref"><h2>Comandos desta missão (toque para inserir)</h2><div class="chips">${f.cmds.map(c=>`<button class="chip" data-cmd="${c}">${esc(COMANDOS[c][0])}<small>${esc(COMANDOS[c][1])}</small></button>`).join("")}</div></div>

  $("#run").onclick = runAll;
  $("#stop").onclick = ()=>{ abort = true; };
  $("#reset").onclick = ()=>{ codeEl.value = f.starter; syncGutter(); saveCode(); fbEl.innerHTML=""; resetBoard(); };
  $("#run").disabled = !ready;
  $("#engine").textContent = ready ? "Java pronto" : "preparando o Java…";
  renderMaps();
  resetBoard();
  window.scrollTo({top:0});
}
function saveCode(){ if (cur!==null && codeEl) store.set("code:"+FASES[cur].id, codeEl.value); }

function renderMaps(){
  const f = FASES[cur], box = $("#maps");
  if (f.maps.length < 2){ box.innerHTML = ""; return; }
  box.innerHTML = f.maps.map((_,k)=>`<button data-m="${k}" aria-current="${k===shownMap}" class="${mapStatus[k]===true?"ok":mapStatus[k]===false?"bad":""}">Terreno ${k+1}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if (running) return; shownMap = +b.dataset.m; renderMaps(); resetBoard(); });
}

/* ---------------- desenho do terreno ---------------- */
const ROVER_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <g fill="#2a1a20">${[22,46,70].map(y=>`<rect x="9" y="${y}" width="13" height="16" rx="4"/><rect x="78" y="${y}" width="13" height="16" rx="4"/>`).join("")}</g>
  <rect x="20" y="24" width="60" height="62" rx="12" fill="#e9e4dd"/>
  <rect x="26" y="42" width="48" height="36" rx="5" fill="#2b3f66"/>
  <g stroke="#5c7fb8" stroke-width="1.5">${[54,66].map(y=>`<line x1="26" y1="${y}" x2="74" y2="${y}"/>`).join("")}${[42,58].map(x=>`<line x1="${x}" y1="42" x2="${x}" y2="78"/>`).join("")}</g>
  <rect x="44" y="10" width="12" height="22" rx="3" fill="#cfc8bf"/>
  <rect x="38" y="6" width="24" height="12" rx="5" fill="#3a2a30"/>
  <circle cx="44" cy="12" r="3.6" fill="#5fe3f0"/><circle cx="56" cy="12" r="3.6" fill="#5fe3f0"/>
  <circle cx="70" cy="32" r="3" fill="#ff8a3d"/>
</svg>`;
const BASE_SVG = `<svg class="flag" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#ece7e1"/><circle cx="20" cy="20" r="18" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="6 4"/><circle cx="20" cy="20" r="9" fill="none" stroke="#2b3f66" stroke-width="3"/><circle cx="20" cy="20" r="3" fill="#ff8a3d"/></svg>`;
let B = {};
function cellSize(map){
  const stage = $("#stage"); const w = map.grid[0].length, h = map.grid.length;
  const avail = stage.clientWidth - 20;
  const maxH = isPhone() ? window.innerHeight*0.5 : window.innerHeight*0.62;
  return Math.max(18, Math.min(58, Math.floor(avail / w), Math.floor(maxH / h)));
}
function resetBoard(){
  const f = FASES[cur], map = f.maps[shownMap];
  const sim = new Sim(map);
  const c = cellSize(map);
  const board = $("#board");
  board.style.setProperty("--c", c+"px");
  board.style.setProperty("--spd", speed+"ms");
  board.style.gridTemplateColumns = `repeat(${sim.w}, ${c}px)`;
  let html = "";
  sim.grid.forEach((row,y)=>row.forEach((ch,x)=>{
    if (ch==="#") html += `<div class="cell w v${(x*7+y*3)%3+1}"></div>`;
    else html += `<div class="cell f ${(x+y)%2?"alt":""}">${(ch==="F"||ch==="G")?BASE_SVG:""}${(ch==="o"||ch==="G")?`<span class="coin" data-k="${x},${y}"></span>`:""}</div>`;
  }));
  html += `<div class="robot" id="robot">${ROVER_SVG}</div>`;
  board.innerHTML = html;
  B = { c, x:sim.x, y:sim.y, rot:sim.dir*90, total:sim.totalCoins, got:0, steps:0 };
  placeRobot(true);
  $("#out").textContent = "";
  status();
  $("#stage").querySelector(".overlay")?.remove();
}
function placeRobot(instant){
  const r = $("#robot"); if (!r) return;
  if (instant){ r.style.transition = "none"; r.querySelector("svg").style.transition = "none"; }
  r.style.transform = `translate(${B.x*B.c}px, ${B.y*B.c}px)`;
  r.querySelector("svg").style.transform = `rotate(${B.rot}deg)`;
  if (instant){ r.offsetHeight; r.style.transition = ""; r.querySelector("svg").style.transition = ""; }
}
function status(){ $("#bstatus").innerHTML = `Cristais <b>${B.got}/${B.total}</b> · Movimentos <b>${B.steps}</b>`; }
const wait = ms => new Promise(r=>setTimeout(r, ms));
async function animate(trace){
  $("#board").style.setProperty("--spd", speed+"ms");
  for (const ev of trace){
    if (abort) return false;
    if (ev.t==="move"){ B.x = ev.x; B.y = ev.y; B.steps++; placeRobot(); }
    else if (ev.t==="turn"){ B.rot += ev.d*90; placeRobot(); }
    else if (ev.t==="pick"){ const coin = $(`.coin[data-k="${ev.x},${ev.y}"]`); if (coin) coin.classList.add("got"); B.got++; }
    else if (ev.t==="crash" || ev.t==="miss"){
      const r = $("#robot"); r.classList.remove("crash"); r.offsetHeight; r.classList.add("crash");
      if (ev.t==="crash"){ const boom = document.createElement("div"); boom.className="boom"; boom.style.left = ev.x*B.c+"px"; boom.style.top = ev.y*B.c+"px"; $("#board").appendChild(boom); }
    }
    else if (ev.t==="say"){
      $("#board").querySelector(".bubble")?.remove();
      const b = document.createElement("div"); b.className="bubble"; b.textContent = ev.v;
      b.style.left = (B.x+.5)*B.c+"px"; b.style.top = (B.y)*B.c-4+"px"; $("#board").appendChild(b);
      await wait(Math.max(700, speed*3));
    }
    status();
    await wait(ev.t==="turn" ? speed*0.8 : speed);
  }
  return true;
}

/* ---------------- execução (Java no navegador) ---------------- */
function simulate(f, map, code){
  const sim = new Sim(map);
  const r = MiniJava.runJava(code, { hosts: { rover: criarRover(sim) }, seed: 7 });
  let err = r.error;
  if (!err && r.needInput) err = { kind:"compile", msg:"o Scanner não funciona nas missões: o rover não lê o teclado" };
  return { sim, out: r.out, err, res: err ? null : sim.result(f) };
}
const CMD_NAMES = Object.keys(COMANDOS).join("|");
function explain(err){
  const line = err.line ? ` (linha ${err.line})` : "";
  if (err.kind === "host"){
    let hint = "";
    if (/rocha/.test(err.msg)) hint = "Confira para onde o rover está virado (a câmera azul mostra a frente) e quantas casas há até a próxima curva.";
    else if (/cristal aqui/.test(err.msg)) hint = "rover.coletar() só funciona em cima de um cristal. Talvez falte ou sobre um rover.andar() antes dele.";
    else if (/energia/.test(err.msg)) hint = "Se usar while, garanta que o laço termine, por exemplo com while (!rover.naBase()).";
    return { msg: err.msg + line, hint };
  }
  if (err.kind === "compile"){
    let hint = "O Java não aceitou o código. Confira ; no fim das instruções, as chaves { } e os parênteses.";
    const m = err.msg.match(new RegExp(`método (${CMD_NAMES})\\b`));
    if (m) hint = `Os comandos do rover são chamados pelo objeto rover: escreva rover.${m[1]}();`;
    else if (/não encontrei o método/.test(err.msg)) hint = "Esse método não existe. Se você criou um, confira se o nome está igual (maiúsculas contam) e se ele está fora do main.";
    else if (/fora de qualquer método/.test(err.msg)) hint = "Todas as instruções precisam ficar dentro de void main() { ... } ou dentro de um método que você criou.";
    return { msg: `Erro de compilação${line}: ${err.msg}`, hint };
  }
  if (err.kind === "timeout") return { msg: "O programa não terminou.", hint: "Algum laço nunca acaba. Confira a condição do while." };
  if (err.kind === "exception") return { msg: err.java + line, hint: "O programa lançou uma exceção." };
  return { msg: err.msg, hint: "" };
}
async function runAll(){
  if (!ready || running) return;
  const f = FASES[cur], code = codeEl.value;
  codeEl.blur(); fbEl.innerHTML = "";
  for (const r of (f.require||[])) if (!r.re.test(code)) return fail(r.msg);
  running = true; abort = false; attempts++;
  const myRun = ++runId;
  $("#run").hidden = true; $("#stop").hidden = false;
  mapStatus = f.maps.map(()=>null); renderMaps();
  if (isPhone()) $(".boardcard").scrollIntoView({behavior:"smooth", block:"start"});
  let allOk = true;
  for (let k = 0; k < f.maps.length; k++){
    shownMap = k; renderMaps(); resetBoard();
    if (k>0) await wait(350);
    if (myRun !== runId) return;
    const { sim, out, err, res } = simulate(f, f.maps[k], code);
    if (err && err.kind === "compile"){ allOk = false; const { msg, hint } = explain(err); fail(msg, hint); break; }
    const done = await animate(sim.trace);
    if (myRun !== runId) return;
    $("#out").textContent = out.trim();
    if (!done){ allOk = false; fbEl.innerHTML = `<div class="feedback bad"><b>Missão abortada</b>Ajuste o código e lance de novo.</div>`; break; }
    if (err){ const { msg, hint } = explain(err); mapStatus[k] = false; renderMaps(); allOk = false; fail(`${f.maps.length>1?`No terreno ${k+1}: `:""}${msg}`, hint); break; }
    if (!res.ok){ mapStatus[k] = false; renderMaps(); allOk = false; fail(`${f.maps.length>1?`No terreno ${k+1}: `:""}${res.msg}`, k>0 ? "Funcionou num terreno mas não em outro: o programa precisa servir para qualquer versão do caminho. Use os sensores." : ""); break; }
    mapStatus[k] = true; renderMaps();
  }
  running = false; $("#run").hidden = false; $("#stop").hidden = true;
  if (allOk) win(f, code);
}
function stopRun(){ abort = true; running = false; runId++; }

function win(f, code){
  const n = starsFor(f, code), lines = linhasDeCodigo(code);
  const best = Math.max(stars[f.id]||0, n); stars[f.id] = best; store.set("stars", stars); updateStarCount();
  const last = cur === FASES.length-1;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="win" role="dialog" aria-label="Missão concluída"><b>${last?"Marte explorado!":"Missão cumprida!"}</b><div class="stars">${starsHtml(n)}</div>
    <span>${lines} linha${lines>1?"s":""} de código · meta para 3 estrelas: ${f.par}</span>
    ${n<3?`<span style="color:var(--ink-soft);font-size:.88rem">Dá para fazer com menos linhas. Que tal um laço ou um método?</span>`:""}
    <div class="row">${last?`<button class="btn primary" data-lv>Ver missões</button>`:`<button class="btn primary" data-next>Próxima missão →</button>`}<button class="btn" data-stay>Melhorar</button></div></div>`;
  $("#stage").appendChild(ov);
  const nx = ov.querySelector("[data-next]"); if (nx) nx.onclick = ()=>openLevel(cur+1);
  const lv = ov.querySelector("[data-lv]"); if (lv) lv.onclick = showLevels;
  ov.querySelector("[data-stay]").onclick = ()=>ov.remove();
  fbEl.innerHTML = `<div class="feedback ok"><b>Missão concluída com ${n} estrela${n>1?"s":""}</b>${f.maps.length>1?`O programa funcionou nos ${f.maps.length} terrenos.`:"O rover chegou à base."}</div>`;
  $("#mission .goal").lastElementChild.innerHTML = `Melhor: <b style="color:var(--star)">${"★".repeat(best)}</b>`;
}
function fail(msg, hint){
  const f = FASES[cur];
  fbEl.innerHTML = `<div class="feedback bad"><b>Ainda não</b><span>${esc(msg)}</span>${hint?`<span style="color:var(--ink)">${esc(hint)}</span>`:""}
    <div class="row"><button class="btn" data-hint>Ver dica</button>${attempts>=2?`<button class="btn" data-sol>Ver solução</button>`:""}</div><div data-extra></div></div>`;
  fbEl.querySelector("[data-hint]").onclick = ()=> fbEl.querySelector("[data-extra]").innerHTML = `<div class="hint">${esc(f.hint)}</div>`;
  const sb = fbEl.querySelector("[data-sol]");
  if (sb) sb.onclick = ()=>{
    const box = fbEl.querySelector("[data-extra]");
    box.innerHTML = `<pre class="solution">${esc(f.solution)}</pre><div class="row" style="margin-top:6px"><button class="btn" data-use>Usar no editor</button></div>`;
    box.querySelector("[data-use]").onclick = ()=>{ codeEl.value = f.solution; syncGutter(); saveCode(); };
  };
}

/* ---------------- editor ---------------- */
function syncGutter(){
  if (!codeEl) return;
  const n = codeEl.value.split("\n").length;
  gutterEl.textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";
  const pw = codeEl.parentElement.clientWidth-40;
  codeEl.style.width = "auto"; codeEl.style.width = Math.max(pw, codeEl.scrollWidth)+"px";
}
function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
function focusEditor(){ if (document.activeElement !== codeEl){ codeEl.focus(); } }
function insertInline(txt){ focusEditor(); insert(txt); }
function insertLine(cmd, back){
  // coloca o comando numa linha própria, com o recuo certo
  if (document.activeElement !== codeEl){
    codeEl.focus();
    // sem cursor definido: insere antes da última chave do main
    const v = codeEl.value, i = v.lastIndexOf("}");
    const p = i > 0 ? v.lastIndexOf("\n", i - 1) : v.length;
    codeEl.setSelectionRange(p < 0 ? v.length : p, p < 0 ? v.length : p);
  }
  const v = codeEl.value, s = codeEl.selectionStart;
  const ls = v.lastIndexOf("\n", s-1)+1, line = v.slice(ls, s);
  if (line.trim()===""){ insert(cmd, back); return; }
  let ind = line.match(/^ */)[0]; if (/\{\s*$/.test(line)) ind += "    ";
  const eol = v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s);
  codeEl.setSelectionRange(eol, eol); insert("\n"+ind+cmd, back);
}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const line = v.slice(v.lastIndexOf("\n", s-1)+1, s);
  const ind = line.match(/^ */)[0];
  if (/\{\s*$/.test(line)){
    if (v[codeEl.selectionEnd] === "}"){ insert("\n" + ind + "    " + "\n" + ind, ind.length + 1); return; }
    insert("\n" + ind + "    "); return;
  }
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,4}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}
function setupEditor(){
  codeEl.addEventListener("input", ()=>{ syncGutter(); saveCode(); });
  codeEl.addEventListener("keydown", e=>{
    const v = codeEl.value, s = codeEl.selectionStart, en = codeEl.selectionEnd;
    if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runAll(); return; }
    if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("    "); return; }
    if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
    if (e.key==="}" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (/^ {4,}$/.test(before)){ e.preventDefault(); codeEl.setRangeText("}", s-4, s, "end"); codeEl.dispatchEvent(new Event("input")); return; }
    }
    if (e.key==="Backspace" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%4+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
    }
  });
  syncGutter();
}
const KEYS = [["⇥","tab"],["⇤","dedent"],[";",";"],["{ }","{}",1],["( )","()",1],["!","!"],["++","++"],["==","=="],["<","<"],["&&"," && "],["for","for (int i = 0; i < 5; i++) {}",1],["while","while () {}",4],["if","if () {}",4],["else","else {}",1],["void","void () {}",5],["int","int "],["[ ]","[]",1],["↵","enter"]];
function setupKeys(){
  const kb = $("#keys"); kb.innerHTML = "";
  KEYS.forEach(([label,val,back])=>{
    const b = document.createElement("button"); b.type="button"; b.textContent=label;
    b.setAttribute("aria-label", val==="tab"?"Recuar":val==="dedent"?"Desfazer recuo":val==="enter"?"Nova linha":"Inserir "+val.trim());
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.onclick = ()=>{ focusEditor();
      if (val==="tab") insert("    "); else if (val==="dedent") dedent(); else if (val==="enter") newline(); else insert(val, back||0); };
    kb.appendChild(b);
  });
}
let lastW = window.innerWidth;
window.addEventListener("resize", ()=>{
  if (Math.abs(window.innerWidth - lastW) < 40) return;
  lastW = window.innerWidth;
  if (cur!==null && !running){ resetBoard(); syncGutter(); }
});

/* ---------------- início ---------------- */
(function(){
  ready = !!window.MiniJava;
  updateStarCount();
  const c = store.get("cur", null);
  if (c!==null && FASES[c] && unlocked(c)) openLevel(c); else showLevels();
})();
</script>

<script>
/* Navegação comum do Código em Jogo:
   - nos jogos: botão "← (lista)" dentro da missão e o "voltar" do celular volta para a lista de missões;
   - nos cursos: o "voltar" do celular volta para o mapa do curso;
   - em todas as telas: botão "Início" no topo, que volta para a página do Código em Jogo. */
(function(){
  var css = document.createElement("style");
  css.textContent = ".cj-voltar{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:6px 14px 6px 10px;border-radius:99px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700;font-size:.86rem;line-height:1.2;cursor:pointer;opacity:.8;min-height:36px}" +
    ".cj-voltar:hover,.cj-voltar:focus-visible{opacity:1}" +
    ".cj-portal{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;font-weight:700;font-size:.88rem;color:inherit;opacity:.75;text-decoration:none}" +
    ".cj-portal:hover,.cj-portal:focus-visible{opacity:1;text-decoration:underline}" +
    ".cj-inicio{display:inline-flex;align-items:center;gap:6px;text-decoration:none}" +
    ".cj-inicio svg{width:18px;height:18px;flex:none}" +
    ".cj-inicio-c{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 12px 6px 9px;border:1.5px solid currentColor;border-radius:99px;font-weight:700;font-size:.82rem;line-height:1.2;color:inherit;text-decoration:none;opacity:.8}" +
    ".cj-inicio-c:hover,.cj-inicio-c:focus-visible{opacity:1}" +
    ".cj-inicio-c svg{width:16px;height:16px;flex:none}" +
    "@media (max-width:600px){.cj-inicio span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.cj-inicio{padding-left:11px!important;padding-right:11px!important}}";
  document.head.appendChild(css);
  var PORTAL = "/";
  var CASA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg>';
  // jogos: botão no cabeçalho, ao lado da lista de missões
  var topo = document.querySelector(".top-r");
  if (topo && !topo.querySelector(".cj-inicio")){
    var a1 = document.createElement("a");
    a1.className = "btn cj-inicio"; a1.href = PORTAL; a1.title = "Voltar para o Código em Jogo";
    a1.setAttribute("aria-label", "Início: voltar para o Código em Jogo");
    a1.innerHTML = CASA + "<span>Início</span>";
    topo.insertBefore(a1, topo.firstChild);
  }
  // cursos: botão no alto da barra lateral (no celular, no alto da página)
  var trilha = document.querySelector("aside.trail");
  if (trilha && !trilha.querySelector(".cj-inicio-c")){
    var a2 = document.createElement("a");
    a2.className = "cj-inicio-c"; a2.href = PORTAL; a2.title = "Voltar para o Código em Jogo";
    a2.innerHTML = CASA + "<span>Código em Jogo</span>";
    trilha.insertBefore(a2, trilha.firstChild);
  }
  function linkPortal(){ return document.createComment("início no topo"); }

  /* ---------- jogos ---------- */
  if (typeof openLevel === "function" && typeof showLevels === "function"){
    var btn = document.getElementById("levelsBtn");
    var rotulo = btn ? btn.textContent.trim() : "Missões";
    var abrir = openLevel, lista = showLevels;
    var naMissao = false, voltando = false;
    try { history.replaceState({ cj: "lista" }, ""); } catch (e){}
    var poeBotao = function(){
      var m = document.getElementById("mission");
      if (!m || m.querySelector(".cj-voltar")) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "cj-voltar"; b.textContent = "← " + rotulo;
      b.setAttribute("aria-label", "Voltar para a lista de " + rotulo.toLowerCase());
      b.onclick = function(){ showLevels(); };
      m.insertBefore(b, m.firstChild);
    };
    var poePortal = function(){
      var v = document.getElementById("view");
      if (v && !v.querySelector(".cj-portal")) v.insertBefore(linkPortal(), v.firstChild);
    };
    var entrou = function(){
      if (!document.getElementById("mission")) return;
      if (!naMissao){ try { history.pushState({ cj: "missao" }, ""); } catch (e){} naMissao = true; }
      poeBotao();
    };
    openLevel = function(){ var r = abrir.apply(this, arguments); entrou(); return r; };
    showLevels = function(){
      var r = lista.apply(this, arguments);
      if (naMissao && !voltando){ naMissao = false; try { history.back(); } catch (e){} }
      naMissao = false;
      poePortal();
      return r;
    };
    window.addEventListener("popstate", function(){
      if (naMissao){ voltando = true; naMissao = false; try { showLevels(); } finally { voltando = false; } }
    });
    if (document.getElementById("mission")) entrou(); else poePortal();
    return;
  }

  /* ---------- cursos ---------- */
  if (typeof openItem === "function"){
    var abrirItem = openItem;
    var noItem = false, voltandoItem = false;
    try { history.replaceState({ cj: "mapa" }, ""); } catch (e){}
    var mapa = function(){
      var l = document.getElementById("lesson");
      if (l && !l.querySelector(".cj-portal")) l.insertBefore(linkPortal(), l.firstChild);
    };
    var depois = function(i){
      if (i === -1){
        if (noItem && !voltandoItem){ noItem = false; try { history.back(); } catch (e){} }
        noItem = false; mapa();
      } else if (!noItem){ try { history.pushState({ cj: "item" }, ""); } catch (e){} noItem = true; }
    };
    openItem = function(i){ var r = abrirItem.apply(this, arguments); depois(i); return r; };
    window.addEventListener("popstate", function(){
      if (noItem){ voltandoItem = true; noItem = false; try { openItem(-1); } finally { voltandoItem = false; } }
    });
    if (typeof current !== "undefined" && current !== -1) depois(current); else mapa();
  }
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
